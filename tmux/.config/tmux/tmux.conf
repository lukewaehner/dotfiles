# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Core settings ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color
set -g escape-time 0                               # no delay for nvim
set -g history-limit 50000
set -g mouse on
set -g focus-events on                             # lets nvim autoread work
set -g base-index 1                                # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Session management ─────────────────────────────────────────────────────────
bind c new-session
bind d detach-client
bind s choose-session                              # fuzzy session picker
bind $ command-prompt -I "#S" "rename-session '%%'"

# ── Window management ──────────────────────────────────────────────────────────
bind n new-window
bind x confirm-before -p "kill window? (y/n)" kill-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5

# ── Pane navigation (vim-style) ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits ─────────────────────────────────────────────────────────────────────
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Reload config ──────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Copy mode (vi keys) ────────────────────────────────────────────────────────
setw -g mode-keys vi
set -s set-clipboard on                            # OSC 52 clipboard sync over SSH
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ── Theme loading ──────────────────────────────────────────────────────────────
# Theme is set by ~/.config/tmux/themes/current.conf which is a symlink
# managed by ~/dotfiles/scripts/theme-switch.sh
# On first install, run: theme-switch.sh dark   (or light)
if-shell "[ -f ~/.config/tmux/themes/current.conf ]" \
  "source-file ~/.config/tmux/themes/current.conf" \
  "source-file ~/.config/tmux/themes/night.conf"
