# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Core settings ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color
set -g escape-time 0                               # no delay for nvim
set -g history-limit 50000
set -g mouse on
set -g focus-events on                             # lets nvim autoread work
set -g base-index 1                                # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                       # don't quit tmux when last session in group closes
setw -g aggressive-resize on                       # better behavior with multiple clients
set -g display-panes-time 2000                     # prefix+q numbers stay 2s
set -g display-time 2000                           # status messages stay 2s
set -g allow-passthrough on                        # nvim image.nvim, kitty graphics, etc.

# ── Session management ─────────────────────────────────────────────────────────
bind c new-session
bind d detach-client
bind s choose-tree -Zs                             # session picker (zoomed)
bind $ command-prompt -I "#S" "rename-session '%%'"
# sesh picker: ^a all | ^t tmux | ^g sesh configs | ^x zoxide | ^f find dir | ^d kill
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 90%,80% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '^a all | ^t tmux | ^g conf | ^x zoxide | ^d kill | ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list --icons)' \
    --preview-window 'right:45%' \
    --preview 'sesh preview {}'
)\""

# ── Window management ──────────────────────────────────────────────────────────
bind N new-window
bind n next-window
bind Tab last-window
bind w choose-tree -Zw                             # window picker (zoomed)
bind X confirm-before -p "kill window #I:#W? (y/n)" kill-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5

# ── Pane management ────────────────────────────────────────────────
bind x kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Layout shortcuts
bind = select-layout even-horizontal
bind + select-layout even-vertical

# ── Splits ─────────────────────────────────────────────────────────────────────
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Popup scratchpad ───────────────────────────────────────────────────────────
# Toggle: opens (or attaches to) a "_scratch" session in a popup.
# Pressing prefix+g again from inside detaches → popup closes.
bind g if -F '#{==:#{session_name},_scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s _scratch"'

# ── workmux (worktree + window per agent) ─────────────────────────────────────
bind W command-prompt -p "worktree branch:" "run-shell -c '#{pane_current_path}' \"workmux add '%%'\""
bind a display-popup -h 30 -w 100 -E "workmux dashboard"     # agents dashboard
bind A run-shell "workmux last-done"                          # jump to agent needing me
bind C-t run-shell "workmux sidebar"

bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind e display-menu -T "#[align=centre]Config" -x C -y C \
  ".zshrc"     z "display-popup -w 85% -h 85% -E 'nvim ~/.zshrc'" \
  ".zprofile"  p "display-popup -w 85% -h 85% -E 'nvim ~/.zprofile'" \
  "tmux.conf"  t "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.conf'" \
  "nvim"       v "display-popup -w 95% -h 95% -d ~/Repos/dotfiles/nvim/.config/nvim -E 'nvim .'" \
  "quit"       q ""

# ── Reload config ──────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Copy mode (vi keys) ────────────────────────────────────────────────────────
setw -g mode-keys vi
set -s set-clipboard on                            # OSC 52 clipboard sync over SSH
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"

# ── Theme loading ──────────────────────────────────────────────────────────────
# Theme is set by ~/.config/tmux/themes/current.conf which is a symlink
# managed by ~/dotfiles/scripts/theme-switch.sh
# On first install, run: theme-switch.sh dark   (or light)
if-shell "[ -f ~/.config/tmux/themes/current.conf ]" \
  "source-file ~/.config/tmux/themes/current.conf" \
  "source-file ~/.config/tmux/themes/night.conf"
set -g status-justify absolute-centre

# ── Plugins (TPM) ──────────────────────────────────────────────────────────────
# Auto-install TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Plugin settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @sessionx-bind 'o'
set -g @sessionx-git-branch 'on'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '53%'

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
