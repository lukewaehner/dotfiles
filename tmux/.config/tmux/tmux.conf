# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Core settings ──────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color
set -g escape-time 0                               # no delay for nvim
set -g history-limit 50000
set -g mouse on
set -g focus-events on                             # lets nvim autoread work
set -g base-index 1                                # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                       # don't quit tmux when last session in group closes
setw -g aggressive-resize on                       # better behavior with multiple clients
set -g display-panes-time 2000                     # prefix+q numbers stay 2s
set -g display-time 2000                           # status messages stay 2s
set -g allow-passthrough on                        # nvim image.nvim, kitty graphics, etc.

# ── Session management ─────────────────────────────────────────────────────────
bind c new-session
bind d detach-client
bind s choose-tree -Zs                             # session picker (zoomed)
bind $ command-prompt -I "#S" "rename-session '%%'"
bind T display-popup -E -w 60% -h 60% 'sel=$(sesh list | fzf --reverse --border --prompt "> "); [ -n "$sel" ] && sesh connect --switch "$sel"'

# ── Window management ──────────────────────────────────────────────────────────
bind N new-window
bind n next-window
bind Tab last-window
bind w choose-tree -Zw                             # window picker (zoomed)
bind X confirm-before -p "kill window #I:#W? (y/n)" kill-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5

# ── Pane management ────────────────────────────────────────────────
bind x confirm-before -p "kill pane #P (#{pane_current_command}) in #I:#W? (y/n)" kill-pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Layout shortcuts
bind = select-layout even-horizontal
bind + select-layout even-vertical

# ── Splits ─────────────────────────────────────────────────────────────────────
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Popup scratchpad ───────────────────────────────────────────────────────────
# Toggle: opens (or attaches to) a "_scratch" session in a popup.
# Pressing prefix+g again from inside detaches → popup closes.
bind g if -F '#{==:#{session_name},_scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s _scratch"'

# ── Reload config ──────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Copy mode (vi keys) ────────────────────────────────────────────────────────
setw -g mode-keys vi
set -s set-clipboard on                            # OSC 52 clipboard sync over SSH
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"

# ── Theme loading ──────────────────────────────────────────────────────────────
# Theme is set by ~/.config/tmux/themes/current.conf which is a symlink
# managed by ~/dotfiles/scripts/theme-switch.sh
# On first install, run: theme-switch.sh dark   (or light)
if-shell "[ -f ~/.config/tmux/themes/current.conf ]" \
  "source-file ~/.config/tmux/themes/current.conf" \
  "source-file ~/.config/tmux/themes/night.conf"

# ── Plugins (TPM) ──────────────────────────────────────────────────────────────
# Auto-install TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugin settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
