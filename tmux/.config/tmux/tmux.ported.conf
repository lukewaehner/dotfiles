# Trial config: tmux.conf + features ported from Sin-cy/dotfiles, on my keybinds.
# Try it on an isolated server without touching the running one:
#   tmux -L ported -f ~/.config/tmux/tmux.ported.conf new -A -s trial
# Adopt it by replacing tmux.conf with this file (then drop the manual plugin
# loading at the bottom in favor of the @plugin lines + TPM).

# ── Base: everything from my current config ───────────────────────────────────
# TPM only reads plugins from ~/.config/tmux/tmux.conf, so its run line in there
# loads my current plugins (resurrect, continuum, vim-tmux-navigator) as usual.
source-file ~/.config/tmux/tmux.conf

bind r source-file ~/.config/tmux/tmux.ported.conf \; display "tmux (ported) config reloaded"

# ── Sesh picker (his prefix+K, on my prefix+T) ────────────────────────────────
# ^a all | ^t tmux sessions | ^g sesh configs | ^x zoxide | ^f find dir | ^d kill
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 90%,80% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '^a all | ^t tmux | ^g conf | ^x zoxide | ^d kill | ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list --icons)' \
    --preview-window 'right:45%' \
    --preview 'sesh preview {}'
)\""

# ── Popups ─────────────────────────────────────────────────────────────────────
# prefix+g stays my persistent scratch shell (replaces his throwaway C-t float).
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind e display-menu -T "#[align=centre]Config" -x C -y C \
  ".zshrc"            z "display-popup -w 85% -h 85% -E 'nvim ~/.zshrc'" \
  ".zprofile"         p "display-popup -w 85% -h 85% -E 'nvim ~/.zprofile'" \
  "tmux.conf"         t "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.conf'" \
  "tmux.ported.conf"  T "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.ported.conf'" \
  "nvim"              v "display-popup -w 95% -h 95% -d ~/Repos/dotfiles/nvim/.config/nvim -E 'nvim .'" \
  "quit"              q ""

# ── Status bar additions (on top of my tokyonight theme) ───────────────────────
set -g status-justify absolute-centre
set -g @online_icon "#[fg=#9ece6a]󰖩 on"
set -g @offline_icon "#[fg=#f7768e,bold]󰖪 off"
# Appended after the theme; a theme-switch re-source drops it until prefix+r.
set -ga status-right " #{online_status} "

# ── Plugins (his stack, minus catppuccin + battery) ────────────────────────────
set -g @sessionx-bind 'o'
set -g @sessionx-git-branch 'on'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '53%'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-online-status'
run '~/.config/tmux/plugins/tmux-sessionx/sessionx.tmux'
run '~/.config/tmux/plugins/tmux-online-status/online_status.tmux'
