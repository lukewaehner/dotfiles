# ── Tokyonight Day ─────────────────────────────────────────────────────────────────────────────────
# Matches folke/tokyonight.nvim style = "day"  (light_style = "day")
# Accent pills aesthetic

# Palette
TD_BG="#e1e2e7"
TD_BG2="#d5d6db"
TD_SURFACE="#c4c8da"
TD_SURFACE2="#b4b5ba"
TD_BORDER="#9699a3"
TD_FG="#343b59"
TD_FG_MUTED="#8990b3"
TD_BLUE="#2e7de9"
TD_MAGENTA="#7847bd"
TD_GREEN="#587539"
TD_CYAN="#007197"

# ── Global bar ─────────────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${TD_BG},fg=${TD_FG_MUTED}"

# ── Left: session pill ───────────────────────────────────────────────────────────────────────────
set -g status-left-length 40
set -g status-left   "#[bg=${TD_BG} fg=${TD_BLUE}]#[bg=${TD_BLUE} fg=${TD_BG} bold] #S #[bg=${TD_BG} fg=${TD_BLUE}] "

# ── Right: git branch pill + time pill ────────────────────────────────────────────
set -g status-right-length 80
set -g status-right   "#{?client_prefix,#[fg=${TD_MAGENTA}]● ,}#[bg=${TD_BG},fg=${TD_SURFACE}]#[bg=${TD_SURFACE},fg=${TD_GREEN}] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | grep . || echo --) #[bg=${TD_BG},fg=${TD_SURFACE}] #[bg=${TD_BG},fg=${TD_BLUE}]#[bg=${TD_BLUE},fg=${TD_BG}] %H:%M #[bg=${TD_BG},fg=${TD_BLUE}]"

# ── Window tabs ───────────────────────────────────────────────────────────────────────────
set -g window-status-separator " "
set -g window-status-style "bg=${TD_BG},fg=${TD_FG_MUTED}"
set -g window-status-format   "#[bg=${TD_BG},fg=${TD_SURFACE2}]#[bg=${TD_SURFACE2},fg=${TD_FG_MUTED},italics] #I #W #[bg=${TD_BG},fg=${TD_SURFACE2}]"

set -g window-status-current-style "bg=${TD_BG},fg=${TD_BLUE}"
set -g window-status-current-format   "#[bg=${TD_BG},fg=${TD_SURFACE}]#[bg=${TD_SURFACE},fg=${TD_BLUE},bold] #I #W #[bg=${TD_BG},fg=${TD_SURFACE}]"

# ── Pane borders ──────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${TD_BORDER}"
set -g pane-active-border-style "fg=${TD_BLUE}"

# ── Message / command prompt ────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=${TD_SURFACE},fg=${TD_CYAN}"
set -g message-command-style "bg=${TD_SURFACE},fg=${TD_MAGENTA}"

# ── Copy mode highlight ──────────────────────────────────────────────────────────────────────────
set -g mode-style "bg=${TD_SURFACE},fg=${TD_CYAN}"
