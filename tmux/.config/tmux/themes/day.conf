# ── Tokyonight Day ───────────────────────────────────────────────────────────────────────────────
# Flat bar adapted from Sin-cy/dotfiles (catppuccin), recoloured to tokyonight.
# Matches folke/tokyonight.nvim style = "day"; adds git branch, clock and workmux status.

# Palette
TD_BG="#e1e2e7"
TD_SURFACE="#c4c8da"
TD_BORDER="#9699a3"
TD_FG_MUTED="#8990b3"
TD_FG_DIM="#6172b0"
TD_BLUE="#2e7de9"
TD_MAGENTA="#7847bd"
TD_GREEN="#587539"
TD_YELLOW="#8c6c3e"
TD_RED="#f52a65"
TD_CYAN="#007197"

# ── Global bar ─────────────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${TD_BG},fg=${TD_FG_MUTED}"

# ── Left: session (red while prefix is held) + zoom label ───────────────────────────────────────────
set -g status-left-length 100
set -g status-left   "#{?client_prefix,#[bg=${TD_RED} fg=${TD_BG} bold],#[bg=${TD_BG} fg=${TD_GREEN}]}  #S #[default]"
set -ga status-left  "#[bg=${TD_BG} fg=${TD_BORDER} none]#{?window_zoomed_flag,│,}"
set -ga status-left  "#[bg=${TD_BG} fg=${TD_YELLOW}]#{?window_zoomed_flag,  zoom ,}"

# ── Right: git branch │ clock ───────────────────────────────────────────────────────────────────────
set -g status-right-length 250
set -g status-right  "#[bg=${TD_BG} fg=${TD_MAGENTA}]  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | grep . || echo --) "
set -ga status-right "#[fg=${TD_BORDER}]│"
set -ga status-right "#[fg=${TD_BLUE}] 󰅐 %H:%M "

# ── Window tabs: flat, │-separated, solid current tab ───────────────────────────────────────────────
set -gF window-status-separator "#[bg=${TD_BG},fg=${TD_BORDER}]│"
set -g window-status-style "bg=${TD_BG},fg=${TD_FG_MUTED}"
set -g window-status-last-style "bg=${TD_BG},fg=${TD_FG_DIM}"
set -g window-status-activity-style "bg=${TD_RED},fg=${TD_BG}"
set -g window-status-bell-style "bg=${TD_RED},fg=${TD_BG},bold"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "

set -g window-status-current-style "bg=${TD_BLUE},fg=${TD_BG},bold"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "

# ── Pane borders ──────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${TD_BORDER}"
set -g pane-active-border-style "fg=${TD_BLUE}"

# ── Message / command prompt ────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=${TD_SURFACE},fg=${TD_CYAN}"
set -g message-command-style "bg=${TD_SURFACE},fg=${TD_MAGENTA}"

# ── Copy mode highlight ──────────────────────────────────────────────────────────────────────────
set -g mode-style "bg=${TD_SURFACE},fg=${TD_CYAN}"
