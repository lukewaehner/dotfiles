# ── Tokyonight Night ─────────────────────────────────────────────────────────────────────────────
# Flat bar adapted from Sin-cy/dotfiles (catppuccin), recoloured to tokyonight.
# Matches folke/tokyonight.nvim style = "night"; adds git branch, clock and workmux status.

# Palette
TN_BG="#1a1b26"
TN_SURFACE="#24283b"
TN_BORDER="#3d4166"
TN_FG_MUTED="#565f89"
TN_FG_DIM="#737aa2"
TN_BLUE="#7aa2f7"
TN_MAGENTA="#bb9af7"
TN_GREEN="#9ece6a"
TN_YELLOW="#e0af68"
TN_RED="#f7768e"
TN_CYAN="#7dcfff"

# ── Global bar ─────────────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${TN_BG},fg=${TN_FG_MUTED}"

# ── Left: session (red while prefix is held) + zoom label ───────────────────────────────────────────
set -g status-left-length 100
set -g status-left   "#{?client_prefix,#[bg=${TN_RED} fg=${TN_BG} bold],#[bg=${TN_BG} fg=${TN_GREEN}]}  #S #[default]"
set -ga status-left  "#[bg=${TN_BG} fg=${TN_BORDER} none]#{?window_zoomed_flag,│,}"
set -ga status-left  "#[bg=${TN_BG} fg=${TN_YELLOW}]#{?window_zoomed_flag,  zoom ,}"

# ── Right: git branch │ clock ───────────────────────────────────────────────────────────────────────
set -g status-right-length 250
set -g status-right  "#[bg=${TN_BG} fg=${TN_MAGENTA}]  #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | grep . || echo --) "
set -ga status-right "#[fg=${TN_BORDER}]│"
set -ga status-right "#[fg=${TN_BLUE}] 󰅐 %H:%M "

# ── Window tabs: flat, │-separated, solid current tab ───────────────────────────────────────────────
set -gF window-status-separator "#[bg=${TN_BG},fg=${TN_BORDER}]│"
set -g window-status-style "bg=${TN_BG},fg=${TN_FG_MUTED}"
set -g window-status-last-style "bg=${TN_BG},fg=${TN_FG_DIM}"
set -g window-status-activity-style "bg=${TN_RED},fg=${TN_BG}"
set -g window-status-bell-style "bg=${TN_RED},fg=${TN_BG},bold"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "

set -g window-status-current-style "bg=${TN_BLUE},fg=${TN_BG},bold"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,}#{?@workmux_status, #{@workmux_status},} "

# ── Pane borders ──────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${TN_BORDER}"
set -g pane-active-border-style "fg=${TN_BLUE}"

# ── Message / command prompt ────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=${TN_SURFACE},fg=${TN_CYAN}"
set -g message-command-style "bg=${TN_SURFACE},fg=${TN_MAGENTA}"

# ── Copy mode highlight ──────────────────────────────────────────────────────────────────────────
set -g mode-style "bg=${TN_SURFACE},fg=${TN_CYAN}"
