# ── Tokyonight Night ────────────────────────────────────────────────────────────────────────────────
# Matches folke/tokyonight.nvim style = "night"
# Accent pills aesthetic

# Palette
TN_BG="#1a1b26"
TN_BG2="#16161e"
TN_SURFACE="#24283b"
TN_SURFACE2="#1f2335"
TN_BORDER="#3d4166"
TN_FG="#c0caf5"
TN_FG_MUTED="#565f89"
TN_BLUE="#7aa2f7"
TN_MAGENTA="#bb9af7"
TN_GREEN="#9ece6a"
TN_CYAN="#7dcfff"

# ── Global bar ─────────────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=${TN_BG},fg=${TN_FG_MUTED}"

# ── Left: session pill ───────────────────────────────────────────────────────────────────────────
set -g status-left-length 40
set -g status-left   "#[bg=${TN_BG} fg=${TN_BLUE}]#[bg=${TN_BLUE} fg=${TN_BG} bold] #S #[bg=${TN_BG} fg=${TN_BLUE}] "

# ── Right: git branch pill + time pill ────────────────────────────────────────────
set -g status-right-length 80
set -g status-right   "#{?client_prefix,#[fg=${TN_MAGENTA}]● ,}#[bg=${TN_BG},fg=${TN_SURFACE}]#[bg=${TN_SURFACE},fg=${TN_GREEN}] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | grep . || echo --) #[bg=${TN_BG},fg=${TN_SURFACE}] #[bg=${TN_BG},fg=${TN_BLUE}]#[bg=${TN_BLUE},fg=${TN_BG}] %H:%M #[bg=${TN_BG},fg=${TN_BLUE}]"

# ── Window tabs ───────────────────────────────────────────────────────────────────────────
set -g window-status-separator " "
set -g window-status-style "bg=${TN_BG},fg=${TN_FG_MUTED}"
set -g window-status-format   "#[bg=${TN_BG},fg=${TN_SURFACE2}]#[bg=${TN_SURFACE2},fg=${TN_FG_MUTED},italics] #I #W #[bg=${TN_BG},fg=${TN_SURFACE2}]"

set -g window-status-current-style "bg=${TN_BG},fg=${TN_BLUE}"
set -g window-status-current-format   "#[bg=${TN_BG},fg=${TN_SURFACE}]#[bg=${TN_SURFACE},fg=${TN_BLUE},bold] #I #W #[bg=${TN_BG},fg=${TN_SURFACE}]"

# ── Pane borders ──────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=${TN_BORDER}"
set -g pane-active-border-style "fg=${TN_BLUE}"

# ── Message / command prompt ────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=${TN_SURFACE},fg=${TN_CYAN}"
set -g message-command-style "bg=${TN_SURFACE},fg=${TN_MAGENTA}"

# ── Copy mode highlight ──────────────────────────────────────────────────────────────────────────
set -g mode-style "bg=${TN_SURFACE},fg=${TN_CYAN}"
