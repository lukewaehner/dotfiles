onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[theme]
# Tokyo Night — matches tmux night.conf/day.conf themes
# "terminal" for light inherits the outer terminal's colors (Ghostty handles the switch)
auto_switch = true
dark_name = "tokyo-night"
light_name = "terminal"

[theme.custom]
# Tokyo Night blue accent (#7aa2f7 from night.conf)
accent = "#7aa2f7"

[terminal]
# Inherit cwd from the source pane — mirrors tmux split -c "#{pane_current_path}"
new_cwd = "follow"

[keys]
# ── Prefix ──────────────────────────────────────────────────────────────────
# Matches tmux: unbind C-b / set -g prefix C-Space
prefix = "ctrl+space"

# ── Workspace (session) management ──────────────────────────────────────────
detach = "prefix+d"                 # tmux: bind d detach-client
workspace_picker = "prefix+s"       # tmux: bind s choose-tree -Zs
new_workspace = "prefix+c"          # tmux: bind c new-session
switch_workspace = "prefix+1..9"    # tmux: bind 1-5 select-window
rename_workspace = "prefix+shift+w" # tmux: bind $ rename-session ($ unavailable in herdr)
goto = "prefix+g"                   # tmux: bind g popup scratch — herdr goto is closest analog

# ── Tab (window) management ──────────────────────────────────────────────────
new_tab = "prefix+shift+n"   # tmux: bind N new-window
next_tab = "prefix+n"        # tmux: bind n next-window
close_tab = "prefix+shift+x" # tmux: bind X kill-window
rename_tab = "prefix+comma"  # freed prefix+shift+t for sesh picker below

# ── Agent navigation ─────────────────────────────────────────────────────────
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# ── Pane navigation (hjkl — same as tmux) ────────────────────────────────────
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# ── Splits ────────────────────────────────────────────────────────────────────
# tmux: bind \ split-window -h  →  side-by-side
# tmux: bind - split-window -v  →  top/bottom
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# ── Other ─────────────────────────────────────────────────────────────────────
zoom = "prefix+z"
toggle_sidebar = "prefix+b"
close_pane = "prefix+x"
edit_scrollback = "prefix+enter" # tmux: bind Enter copy-mode
reload_config = "prefix+r"       # tmux: bind r source-file ...
resize_mode = "prefix+shift+r"   # moved here to free prefix+r for reload

# ── Custom commands ───────────────────────────────────────────────────────────

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Sesh workspace picker (tmux: bind T display-popup ... sesh list | fzf)
[[keys.command]]
key = "prefix+shift+t"
type = "pane"
command = "sel=$(sesh list | fzf --reverse --border --prompt '> '); [ -n \"$sel\" ] && sesh connect --switch \"$sel\""

# Lazygit (carried from herdr default example)
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[ui]
mouse_capture = true
confirm_close = true

show_agent_labels_on_pane_borders = true
[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

[ui.toast]
delivery = "system"
